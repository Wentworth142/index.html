
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <link rel="stylesheet" href="example.css">
</head>
<body>

    <!-- Home Link -->
    <a href="portfolio.html">Home</a>

    <h1>My Photo Gallery</h1>

    <div class="carousel" id="carousel">
        <div class="slides">
            <figure class="slide">
                <img src="9f28d199-d98a-4ea2-914a-671267e818ed.jpg" alt="Describe image 1">
                <figcaption>Caption for image 1</figcaption>
            </figure>
            <figure class="slide">
                <img src="346fc6ff-d6fc-4a77-b946-a43cd9143ae1.jpg" alt="Describe image 2">
                <figcaption>Caption for image 2</figcaption>
            </figure>
            <figure class="slide">
                <img src="c688cadd-66a0-4f30-b281-44753c5b841d.jpg" alt="Describe image 3">
                <figcaption>Caption for image 3</figcaption>
            </figure>
            <figure class="slide">
                <img src="cdd89d0e-9111-40ae-afc4-71b53ded15e1.jpg" alt="Describe image 4">
                <figcaption>Caption for image 4</figcaption>
            </figure>

            <!-- Navigation Buttons -->
            <button class="nav prev" type="button" aria-label="Previous slide">&#10094;</button>
            <button class="nav next" type="button" aria-label="Next slide">&#10095;</button>
        </div>

        <!-- Dynamic Dots Container -->
        <div class="dots"></div>
    </div>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            const $carousel = $("#carousel");
            const $slides = $carousel.find(".slide");
            const $dotsBox = $carousel.find(".dots");
            const total = $slides.length;
            const FADE_TIME = 500;
            const DELAY = 4000;
            let current = 0;
            let timer = null;

            $slides.hide().eq(0).show();

            $slides.each(function (i) {
                $("<button>")
                    .attr({ type: "button", "aria-label": "Go to slide " + (i + 1) })
                    .addClass("dot" + (i === 0 ? " active" : ""))
                    .data("index", i)
                    .appendTo($dotsBox);
            });
            const $dots = $dotsBox.find(".dot");

            function showSlide(index) {
                if (index === current) return;
                $slides.eq(current).stop(true, true).fadeOut(FADE_TIME);
                $slides.eq(index).stop(true, true).fadeIn(FADE_TIME);
                $dots.removeClass("active").eq(index).addClass("active");
                current = index;
            }

            function nextSlide() { showSlide((current + 1) % total); }
            function prevSlide() { showSlide((current - 1 + total) % total); }

            $carousel.on("click", ".next", nextSlide);
            $carousel.on("click", ".prev", prevSlide);
            $dotsBox.on("click", ".dot", function () {
                showSlide($(this).data("index"));
            });

            function startAutoplay() {
                clearInterval(timer);
                timer = setInterval(nextSlide, DELAY);
            }
            function stopAutoplay() {
                clearInterval(timer);
            }

            $carousel.on("mouseenter", stopAutoplay)
                     .on("mouseleave", startAutoplay);
            startAutoplay();

            $(document).on("keydown", function (event) {
                if (event.key === "ArrowRight") {
                    nextSlide();
                } else if (event.key === "ArrowLeft") {
                    prevSlide();
                }
            });
        });
    </script>
</body>
</html>

</body>
</html>
